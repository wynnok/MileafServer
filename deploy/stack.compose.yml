# Managed by deploy/install.sh. Separate from the existing-server Compose file.
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: teslamate
      MILEAF_READER_PASSWORD: ${MILEAF_READER_PASSWORD:?}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?}
    volumes:
      - database:/var/lib/postgresql/data
      - ./mileaf-reader.sql:/bootstrap/mileaf-reader.sql:ro
      - ./stack-reader.sql:/bootstrap/stack-reader.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U teslamate -d teslamate"]
      interval: 5s
      timeout: 5s
      retries: 30

  teslamate:
    image: teslamate/teslamate:4.3.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      DATABASE_USER: teslamate
      DATABASE_PASS: ${POSTGRES_PASSWORD:?}
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      DISABLE_MQTT: ${DISABLE_MQTT:?}
      MQTT_HOST: mosquitto
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDRESS:?}:${TESLAMATE_PORT:?}:4000"
    volumes:
      - import:/opt/app/import
    cap_drop: [ALL]

  mileaf:
    image: ${COMPOSE_PROJECT_NAME:?}-server:local
    build:
      context: ${MILEAF_SOURCE_DIR:?}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      MILEAF_DATABASE_DSN: postgresql://mileaf_reader:${MILEAF_READER_PASSWORD:?}@database:5432/teslamate
      MILEAF_STATE_FILE: /data/state.json
      MILEAF_LISTEN_ADDRESS: 0.0.0.0:8080
    ports:
      - "${BIND_ADDRESS:?}:${MILEAF_PORT:?}:8080"
    volumes:
      - mileaf-state:/data

  mosquitto:
    image: eclipse-mosquitto:2
    profiles: [mqtt]
    restart: unless-stopped
    # Only accessible inside this site's private Compose network; no host port.
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: [CMD, mosquitto_pub, -h, localhost, -t, mileaf/health, -m, ok]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: teslamate/grafana:4.3.0
    profiles: [grafana]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_USER: grafana_reader
      DATABASE_PASS: ${GRAFANA_READER_PASSWORD:?}
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${BIND_ADDRESS:?}:${GRAFANA_PORT:?}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

# Compose creates a site-specific bridge; service names resolve on this network.
volumes:
  database:
  import:
  mileaf-state:
  mqtt-data:
  grafana-data:
